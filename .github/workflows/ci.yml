name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Format
        run: bun run format:check
      - name: Validate data (schemas, sources, entity references, staleness)
        run: bun run validate
      - name: Framework tests (rules + expected ratings per asset)
        run: bun run test
      - name: Typecheck
        run: bunx next typegen && bunx tsc --noEmit
      - name: Build
        run: bun run build
