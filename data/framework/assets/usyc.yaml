asset: usyc
profile: { value: tbill-mmf, source: { url: "https://developers.circle.com/tokenized/usyc/overview", note: "Short-duration Treasuries and reverse repo, earning about the overnight rate.", checkedAt: 2026-10-25 } }

underlying:
  holdings:
    status: public
    value:
      asOf: 2026-10-25
      basis: mandate
      items:
        - { type: government-bills, pct: 100, label: "T-bills and Treasury reverse repo" }
    source: { url: "https://app.rwa.xyz/assets/USYC", note: "'USYC provides exposure to short duration US Treasuries and Reverse Repo on US Treasuries.' The issuer's price reports give only fund-level principal and interest; no holdings list or weights are public.", checkedAt: 2026-10-25 }
  wamDays: { status: not_public, searchedAt: 2026-10-25 }
  trackRecord: { value: { since: 2023-03-17, losses: [] }, source: { url: "https://usyc.hashnote.com/api/price-reports", note: "Fund incorporated 2023-03-17. Price reports rise steadily; no drop found.", checkedAt: 2026-10-25 } }

counterparties:
  custodian: { status: public, value: bny, source: { url: "https://forum.arbitrum.foundation/t/hashnote-usyc-step-application/23587", note: "Assets held at BNY Mellon through prime broker Marex (2024 statement, before the Circle acquisition).", checkedAt: 2026-10-25 } }
  fundAdministrator: { status: public, value: nav-fund-services, source: { url: "https://usyc.docs.hashnote.com/overview/service-providers", note: "Fund Administrator: NAV Consulting", checkedAt: 2026-10-25 } }
  auditor: { status: public, value: cohen-and-co, source: { url: "https://usyc.docs.hashnote.com/overview/service-providers", note: "Auditor: Cohen and Company. rwa.xyz lists Valaston International instead.", checkedAt: 2026-10-25 } }
  affiliated: { value: [], source: { url: "https://usyc.docs.hashnote.com/overview/service-providers", checkedAt: 2026-10-25 } }
  settlementRails: { value: [usdc], source: { url: "https://developers.circle.com/tokenized/usyc/overview", note: "Subscriptions and redemptions are in USDC.", checkedAt: 2026-10-25 } }
  operators:
    - { role: "Prime broker", name: "Marex", source: { url: "https://usyc.docs.hashnote.com/overview/service-providers", checkedAt: 2026-10-25 } }
    - { role: "Bank", name: "Customers Bank", source: { url: "https://usyc.docs.hashnote.com/overview/service-providers", checkedAt: 2026-10-25 } }

control:
  audits:
    - { auditor: "Unnamed firm", scope: "USYC contracts", date: 2024-03-01, source: { url: "https://forum.arbitrum.foundation/t/hashnote-usyc-step-application/23587", note: "'USYC was last audited in March, 2024'; the report isn't published. Etherscan shows no audit for the current implementation.", checkedAt: 2026-10-25 } }
  bugBounty: { status: unknown, note: "Circle runs a HackerOne program; whether USYC is in scope isn't public." }
  powersDocumented: { value: false, source: { url: "https://developers.circle.com/tokenized/usyc/smart-contracts", note: "Lists contract addresses only; no roles or powers.", checkedAt: 2026-10-25 } }
  signersIndependent: { status: not_public, searchedAt: 2026-10-25 }
  chains:
    - { chain: ethereum, mechanism: native+bridge, provider: "Circle CCTP, a TokenManagerProxy (likely Axelar)", source: { url: "https://developers.circle.com/tokenized/usyc/smart-contracts", note: "Both hold unlimited minter allowances on the Ethereum token.", checkedAt: 2026-10-25 } }
    - { chain: "bsc, arc, solana", mechanism: native, provider: "Circle", source: { url: "https://developers.circle.com/tokenized/usyc/smart-contracts", checkedAt: 2026-10-25 } }

transparency:
  reports:
    - name: Hashnote price reports
      provider: hashnote
      dataSource: issuer
      granularity: nav
      frequency: daily
      verifiability: self-reported
      onchain: true
      source: { url: "https://usyc.hashnote.com/api/price-reports", note: "Fund-level principal, interest and balance, posted by the fund-admin key. No holdings list or third-party attestation found.", checkedAt: 2026-10-25 }
  eventReporting: { status: unknown, note: "Only asked for private credit." }

pricing:
  stalenessDetectable: { value: true, source: { url: "https://usyc.docs.hashnote.com/overview/token-price", note: "latestRoundData returns the report's updatedAt.", checkedAt: 2026-10-25 } }
  lossRecognition: { value: next-nav, source: { url: "https://usyc.docs.hashnote.com/overview/token-price", note: "Price set once per business day after the prime broker reports.", checkedAt: 2026-10-25 } }

exit:
  dealing: { value: continuous, source: { url: "https://developers.circle.com/tokenized/usyc/overview", note: "Teller redeems 24/7, atomically, while treasury liquidity lasts.", checkedAt: 2026-10-25 } }
  noticeDays: { status: public, value: 0, source: { url: "https://developers.circle.com/tokenized/usyc/overview", checkedAt: 2026-10-25 } }
  lockupDays: { status: public, value: 0, source: { url: "https://developers.circle.com/tokenized/usyc/overview", checkedAt: 2026-10-25 } }
  dailyCapUsd: { status: not_public, searchedAt: 2026-10-25, note: "Per-account limits are set by the fund admin; 'If you require more liquidity on a specific day, please contact us'." }
  minimumUsd: { status: public, value: 0, source: { url: "https://app.rwa.xyz/assets/USYC", checkedAt: 2026-10-25 } }
  feeBps: { status: public, value: 0, source: { url: "https://usyc.docs.hashnote.com/overview/fees", note: "3 bps on redemptions above $1M a day.", checkedAt: 2026-10-25 } }
  liquidators: { value: allowlisted, source: { url: "https://developers.circle.com/tokenized/usyc/overview", note: "Transfers check the Entitlements allowlist on both sides. Aave Horizon's aUSYC holds the custodian role.", checkedAt: 2026-10-25 } }
  instant:
    - label: USYC Teller (USDC from the Circle treasury wallet)
      chain: ethereum
      address: "0xeE35F963BFC71b51eC95147f26c030D674ea30e6"
      dailyCapUsd: { status: not_public, searchedAt: 2026-10-13 }
      fundedUsd: { status: public, value: 38304339, source: { url: "https://etherscan.io/address/0xeE35F963BFC71b51eC95147f26c030D674ea30e6", note: "totalAssets = min(treasury USDC 42.43M, allowance 38.30M); topped up by hand.", checkedAt: 2026-10-13 } }
