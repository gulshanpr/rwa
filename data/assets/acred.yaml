  minimumInvestment:
    status: public
    value: 50000
    source: { url: "https://reports.adviserinfo.sec.gov/reports/ADV/315859/PDF/315859.pdf", note: "Securitize Capital LLC Form ADV, Schedule D 7.B.(1), private fund 805-2083739898: 'Minimum investment commitment … $ 50,000'. Token Terminal also says USDC 50,000. The onchain OnRamp minSubscriptionAmount was 1,000 USDC at review. Form D and the 2026-02-12 amendment both enter $0 as the minimum accepted from an outside investor. Which figure an investor actually faces is not settled.", checkedAt: 2026-10-24 }
  transferRestricted:
