# Synced with Postgres. Edit in /admin and run `bun rwa export`, or edit here and run `bun rwa import`.
slug: acred
name: Apollo Diversified Credit Securitize Fund
ticker: ACRED
assetClass: private-credit
description: >
  Tokenized feeder into Apollo Diversified Credit Fund, a 1940 Act closed-end interval fund. The token is Securitize DS Protocol on a standard upgradeable proxy, with a different owner wallet from BUIDL. One wallet can upgrade, mint and seize, with no timelock. The Apollo fund offers to buy back at least 5% of shares each quarter. Also deployed on Ink, Sei, Solana and Aptos, which this version does not read.
issuer: acred-fund
manager: apollo
platform: securitize
tokenStandard: ds-protocol
priceModel: accumulating-nav

deployments:
  - chain: ethereum
    token: "0x17418038ecF73BA4026c4f428547BF099706F27B"
    discovery:
      ignoreMethods: []
      labels:
        "0x59c1eacec450c57dcb9b8725d0f96635c2b676ee": ACRED owner and MASTER (single wallet)
        "0x22F53B51E4272F954f25BC377B1b759c6C5A528B": ISSUER key (single wallet)
        "0x8d35600bBD1eE2d1001788cef8d3785537a81C78": ISSUER key (single wallet, nonce 0 at review)
        "0xB40Ee3fC18f7de7ac7C97e307c4aD523e0821a48": TRANSFER_AGENT key (single wallet)
        "0x3ee611d581d2c6a81459fff8c6c8d197b0ad1a3e": WalletRegistrar owner (single wallet)
        "0x805c7a5eb2d89dae4319c7a502ec5ce163f52615": OnRamp custodian wallet (single wallet)
        "0xd6bcbbc87bfb6c8964ddc73dc3eae6d08865d51c": RedStone ACRED_FUNDAMENTAL feed
  - chain: avalanche
    token: "0x7C64925002BFA705834B118a923E9911BeE32875"
    discovery:
      ignoreMethods: []
  - chain: polygon
    token: "0xFCe60bBc52a5705CeC5B445501FBAf3274Dc43D0"
    discovery:
      ignoreMethods: []

