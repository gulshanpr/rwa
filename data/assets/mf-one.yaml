    source: { url: "https://docs.midas.app/resources/smart-contracts-registry", note: "The token blocks only blacklisted addresses. Deposit and redemption vaults require the greenlist. Secondary transfers between non-blacklisted wallets are open.", checkedAt: 2026-10-14 }

