pricing:
  reference:
    type: oracle
    provider: midas
    chain: ethereum
    address: "0x8D51DBC85cEef637c97D02bdaAbb5E274850e68C"
    writer: eoa
    dataOrigin: issuer
    cadenceSeconds: 86400
    businessDaysOnly: true
    historyOnchain: true
    source: { url: "https://docs.midas.app/transparency/oracle-architecture", note: "CustomAggregatorFeed mF-ONE/USD, 8 decimals. setRoundDataSafe caps each update at 0.4% and waits at least an hour. setRoundData, held by the same wallet, skips the cap. The vault DataFeed 0xcf4e49f5e750af8f2f9aa1642b68e5839d9c1c00 accepts the answer for 30 days and bounds it between 0.90 and 1.23. Docs say two co-signers review updates offchain; the onchain writer is one wallet. Morpho does not read this feed directly. Its oracle uses CustomAggregatorV3CompatibleFeedDiscounted 0x4386307a07C4de7Ba11B4F4ec3e1f37BBE95dC99, whose underlyingFeed is this contract, with a 7.7% discount.", checkedAt: 2026-10-14 }
  stalenessDetectable:
    value: true
    source: { url: "https://etherscan.io/address/0x8D51DBC85cEef637c97D02bdaAbb5E274850e68C", note: "CustomAggregatorFeed returns updatedAt.", checkedAt: 2026-10-25 }
  lossRecognition:
    value: next-nav
    source: { url: "https://docs.midas.app/transparency/oracle-architecture", note: "Roughly daily NAV updates on business days.", checkedAt: 2026-10-25 }

