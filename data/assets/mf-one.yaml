  fundAdministrator:
    status: not_public
    searchedAt: 2026-10-14
  auditor:
    status: not_public
    searchedAt: 2026-10-14
    note: Midas Software GmbH's statutory auditor (Dirk Stresska, Ausborn & Partner) is named in the final terms of a different Midas product. That is not treated as the mF-ONE auditor.
  transferAgent:
    status: not_public
    searchedAt: 2026-10-14

legal:
