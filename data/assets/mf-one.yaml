    whoCanRedeem:
      value: whitelisted-holders
      source: { url: "https://docs.midas.app/resources/smart-contracts-registry", note: "Redemption vault greenlistEnabled is true. The token itself is transferable without the greenlist.", checkedAt: 2026-10-14 }
    settlement:
      status: public
      value: T+7
      source: { url: "https://midas.app/mfone", note: "midas.app: standard redemptions in 1 to 7 business days; scored at the upper bound. Instant redemption is separate. Unresolved: Steakhouse's launch review (June 2025) describes a rolling 30-day redemption backed by quarterly liquidity in the underlying F-ONE fund, and The Block's launch coverage a quarterly liquidity framework; the offering terms were not available to confirm which applies.", checkedAt: 2026-10-14 }
    gatesOrSuspension:
      status: not_public
      searchedAt: 2026-10-14
      note: The vault admin can pause any vault function and the token pauser can freeze transfers. The legal suspension wording is not public. Docs say pauses are multisig-authorised; onchain, a single wallet holds the pause role.
  dealing:
    value: continuous
    source: { url: "https://etherscan.io/address/0x44b0440e35c596e858cEA433D0d82F5a985fD19C", note: "Instant redemption (1% fee) at any time; standard fee-free requests settle after the next NAV, in 1 to 7 business days per midas.app.", checkedAt: 2026-10-31 }
  noticeDays:
    status: public
    value: 0
    source: { url: "https://etherscan.io/address/0x44b0440e35c596e858cEA433D0d82F5a985fD19C", note: "Instant redemption needs no notice. Steakhouse (June 2025) described 30 days' notice at the F-ONE level, which Midas carries, not the holder.", checkedAt: 2026-10-31 }
  lockupDays:
    status: public
    value: 0
    source: { url: "https://etherscan.io/address/0x44b0440e35c596e858cEA433D0d82F5a985fD19C", note: "The vault enforces no lock-up and Midas states none.", checkedAt: 2026-10-31 }
  dailyCapUsd:
