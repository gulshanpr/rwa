  insolvency:
    status: public
    value: "Claims are subordinated (qualified subordination). The redemption amount is a hypothetical best-efforts liquidation net of fees and may differ from the oracle price. Midas docs, as summarized publicly, say a holder can lose the entire claim."
    source: { url: "https://www.findas.org/tokenomics-review/the-tokenomics-of-midas-mf-one-mf-one", checkedAt: 2026-10-14 }

pricing:
  reference:
    type: oracle
    provider: midas
    chain: ethereum
    address: "0x8D51DBC85cEef637c97D02bdaAbb5E274850e68C"
    writer: eoa
    dataOrigin: issuer
    cadenceSeconds: 86400
    businessDaysOnly: true
    historyOnchain: true
    source: { url: "https://docs.midas.app/transparency/oracle-architecture", note: "CustomAggregatorFeed mF-ONE/USD, 8 decimals. setRoundDataSafe caps each update at 0.4% and waits at least an hour. setRoundData, held by the same wallet, skips the cap. The vault DataFeed 0xcf4e49f5e750af8f2f9aa1642b68e5839d9c1c00 accepts the answer for 30 days and bounds it between 0.90 and 1.23. Docs say two co-signers review updates offchain; the onchain writer is one wallet. Morpho does not read this feed directly. Its oracle uses CustomAggregatorV3CompatibleFeedDiscounted 0x4386307a07C4de7Ba11B4F4ec3e1f37BBE95dC99, whose underlyingFeed is this contract, with a 7.7% discount.", checkedAt: 2026-10-14 }

verification:
  methods:
    - type: attestation
      provider: midas
      independent: true
      assetLevel: false
      frequency: weekly
      cryptographicallyVerifiable: true
      onchain: true
      feed: { chain: ethereum, address: "0x2D6e9F608807436DE5D9603B00Abe3FEd1Bc809d" }
      source: { url: "https://docs.midas.app/transparency/oracle-architecture", note: "Midas Attestation Engine. NAV email is notarised with vlayer and checked by LlamaRisk and Canary. The NAV still originates with Fasanara. Asset-level custodian PDFs are described with placeholder IPFS links, so asset-level is not counted. The latest report at review was 2026-10-09, about four days old, so the daily test fails.", checkedAt: 2026-10-14 }

exit:
  redemption:
    available:
      value: true
      source: { url: "https://app.rwa.xyz/assets/mF-ONE", note: "Standard redemption on vault 0x44b0440e35c596e858cEA433D0d82F5a985fD19C is fee-free after the next NAV. rwa.xyz says 2 business days. midas.app says 1–7 business days.", checkedAt: 2026-10-14 }
    whoCanRedeem:
      value: whitelisted-holders
      source: { url: "https://docs.midas.app/resources/smart-contracts-registry", note: "Redemption vault greenlistEnabled is true. The token itself is transferable without the greenlist.", checkedAt: 2026-10-14 }
    settlement:
      status: public
      value: T+2
      source: { url: "https://app.rwa.xyz/assets/mF-ONE", note: "Standard path is T+2 or longer. Instant redemption is separate.", checkedAt: 2026-10-14 }
    minimum:
      value: 1
      source: { url: "https://etherscan.io/address/0x44b0440e35c596e858cEA433D0d82F5a985fD19C", note: "Onchain redemption minimum is 1 mF-ONE. Fiat redemption minimum is 1,000.", checkedAt: 2026-10-14 }
    gatesOrSuspension:
      status: not_public
      searchedAt: 2026-10-14
      note: The vault admin can pause any vault function and the token pauser can freeze transfers. The legal suspension wording is not public. Docs say pauses are multisig-authorised; onchain, a single wallet holds the pause role.
  instantLiquidity:
    - type: offramp-contract
      label: Instant redemption into mTBILL (1% fee)
      chain: ethereum
      address: "0x44b0440e35c596e858cEA433D0d82F5a985fD19C"
      depthPctOfSupply: 9
      source: { url: "https://etherscan.io/address/0x44b0440e35c596e858cEA433D0d82F5a985fD19C", note: "instantFee is 1%. Daily limit 30,000,000 mF-ONE. At review the vault held about 6.03M mTBILL and 0 USDC, roughly 9% of AUM. A second redemption vault 0x375e…bb48 has no daily limit.", checkedAt: 2026-10-14 }

