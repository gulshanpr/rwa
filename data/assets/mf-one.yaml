    status: public
    value: German exempt-offer tokenized certificate (debt instrument), qualified subordination
    source: { url: "https://midas.app/mfone", note: "Summarized by findas.org from Midas docs. Holders have no legal or beneficial interest in the underlying assets.", checkedAt: 2026-10-14 }
  jurisdiction:
    status: public
    value: Germany
    source: { url: "https://midas.app/mfone", checkedAt: 2026-10-14 }
  lei:
    status: public
    value: 984500BB00BN6D2B7C48
    source: { url: "https://api.gleif.org/api/v1/lei-records/984500BB00BN6D2B7C48", note: "GLEIF ISSUED record for Midas Software GmbH, Germany. This is the issuer entity, not a separate fund vehicle.", checkedAt: 2026-10-14 }
  secFilings:
    status: not_public
    searchedAt: 2026-10-14
    note: Exempt offer. No MFSA filing for mF-ONE was found.
  offeringDocument:
    status: not_public
    searchedAt: 2026-10-14
    note: Final terms and the base prospectus were not found.
  auditedFinancials:
    status: not_public
