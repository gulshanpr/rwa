# Synced with Postgres. Edit in /admin and run `bun rwa export`, or edit here and run `bun rwa import`.
slug: mf-one
name: Midas Fasanara ONE
ticker: mF-ONE
assetClass: private-credit
description: >
  Tokenized certificate giving indirect exposure to Fasanara Capital's F-ONE strategy (fintech receivables, SME lending, real-estate credit and delta-neutral digital assets). Holders have no beneficial interest in the underlying, and the claims are subordinated. Midas uses one shared permissions contract across its tokens. A 48-hour timelock covers upgrades only; granting a mint or burn role is instant. The published signer policy (4 or more) does not match the 1-of-3 Safe onchain.
issuer: midas-software-gmbh
manager: fasanara
platform: midas
tokenStandard: custom
priceModel: accumulating-nav

deployments:
  - chain: ethereum
    token: "0x238a700eD6165261Cf8b2e544ba797BC11e466Ba"
    discovery:
      ignoreMethods: []
      labels:
        "0x0312a9d1ff2372ddedcbb21e4b6389afc919ac4b": Midas Controller (shared)
        "0xe3eee3e0d2398799c884a47fc40c029c8e241852": Midas timelock (48 hours)
        "0xb60842e9dabcd1c52e354ac30e82a97661cb7e89": Admin Safe (1 of 3)
        "0xd4195cf4df289a4748c1a7b6ddbe770e27ba1227": DEFAULT_ADMIN (single wallet)
        "0x4f75307888fd06b16594cc93ed478625ad65eeea": Mint, burn and pause (single wallet)
        "0x85a56e098b6159d2560aa2ba4f70e8ef3ae7e5e9": Price writer (single wallet)
        "0x2acb4bdcbef02f81bf713b696ac26390d7f79a12": Vault admin (single wallet)
        "0x8D51DBC85cEef637c97D02bdaAbb5E274850e68C": mF-ONE/USD price feed
        "0x9Db5B0B081E2202fb588cbD541B01b77f45Cfe2d": Largest holder at review (about 45%, identity unknown)

