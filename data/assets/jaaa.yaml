verification:
  methods:
    - type: proof-of-asset
      provider: chronicle
      independent: true
      assetLevel: true
      frequency: daily
      cryptographicallyVerifiable: true
      onchain: true
      feed: { chain: ethereum, address: "0x5D44916E0Db13EcD661b20Df4D645904E57589C8" }
      source: { url: "https://docs.chroniclelabs.org/Products/proofOfAsset/integratingPOAs/routers", note: "Router readWithAge matched JAAA's NAV at review. Blockscout labels this contract ChronicleVAO_FakeWho_FAKEWAT_Router_1, which conflicts with Chronicle's docs. Aave Horizon does not read this router. Its getSourceOfAsset for JAAA is 0xF77f2537dba4ffD60f77fACdfB2c1706364fA03d (the LlamaGuard feed Vault Street cites). Horizon LTV is 81% and the liquidation threshold is 86%.", checkedAt: 2026-10-14 }

