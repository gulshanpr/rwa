slug: jaaa
name: Janus Henderson Anemoy AAA CLO Fund
ticker: JAAA
assetClass: private-credit
description: >
  Tokenized shares of a BVI segregated portfolio holding AAA-rated CLO tranches, with Janus Henderson as sub-manager. Runs on the same Centrifuge V3 deployment as JTRSY. The same single wallet that sets JTRSY's price sets JAAA's NAV. That role used to be a 3-of-8 Safe. Subscriptions and redemptions are requests through ERC-7540 vaults. Solana and Stellar supply is backed by Ethereum escrows and is already inside the Ethereum figure. Plume, Monad and other non-tracked chains are not read.
issuer: anemoy-capital-spc
manager: anemoy-asset-management
platform: centrifuge
tokenStandard: custom
priceModel: accumulating-nav

