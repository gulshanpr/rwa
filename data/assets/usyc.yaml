# Synced with Postgres. Edit in /admin and run `bun rwa export`, or edit here and run `bun rwa import`.
slug: usyc
name: Circle USYC
ticker: USYC
assetClass: us-treasuries
description: >
  Tokenized shares of Hashnote International Short Duration Yield Fund, a Cayman fund that earns roughly the overnight Fed funds rate through reverse repo on US government securities and T-bills. Issued by Circle International Bermuda since Circle bought Hashnote in January 2025. About 98% of supply is on BNB Chain.
issuer: hashnote-sdyf
manager: hashnote-management
platform: hashnote
tokenStandard: custom
priceModel: accumulating-nav

deployments:
  - chain: ethereum
    token: "0x136471a34f6ef19fE571EFFC1CA711fdb8E49f2b"
    discovery:
      ignoreMethods: []
      labels:
        "0xdbe01f447040f78ccbc8dfd101bec1a2c21f800d": USYC fund admin (role 255; issuer says MPC)
        "0x85fbfb6a6ef755797cf65a4c7d7a90423f96d011": Unlimited minter, no roles (identity unknown)
        "0x13ff8cabb86edf94a2df4f98773bda4005182dd6": USYC token owner
        "0x8fb098d65b38f8425de8f80ad54ee990fb5d2fc0": Entitlements owner
        "0x8b1a2015758578669e1ddbd98242648130a3a55b": Teller owner
        "0x1de107dc268f4be3ee688cf24c7742f6ebb19e98": Oracle owner (nonce 0)
        "0x0a18ae6fc841226d611931d38ecec8893ac89f5a": PriceReporter owner
        "0x51261c0fead5f7e2e3288b25208faaee70215ec5": Teller treasury (pays USDC redemptions)
        "0xfd78ee919681417d192449715b2594ab58f5d002": Circle CCTP TokenMinterV2
        "0x6a41494c22cb69f639cd6e43ce3a68818db8c378": TokenManagerProxy (bridge, likely Axelar ITS)
        "0x902d906b8d988092213be799b18bd2cbd64f808c": Entitlements (RolesAuthority)
        "0xee35f963bfc71b51ec95147f26c030d674ea30e6": USYC Teller (USDC)
        "0x74f2199aeb743f68f05943e5715a33eaf2b61f53": USYC Oracle
        "0x9fde717a21c5b272b8956d3aa0c3551e1ffd23d7": USYC PriceReporter
  - chain: bsc
    token: "0x8D0fA28f221eB5735BC71d3a0Da67EE5bC821311"
    discovery:
      ignoreMethods: []
      labels:
        "0xcd636d955a95385ec5e2776b167b92e89ef6f70e": USYC BSC token owner
        "0x2d833ef0b55a7578e6f0f86fbf29674e4a250782": BSC Entitlements owner
        "0x6b7d54003f73be979cf92bf369432ac534853692": BSC Entitlements (RolesAuthority)

access:
  investorType:
    value: non-us-persons
    source: { url: "https://usyc.docs.hashnote.com/overview/investor-onboarding", note: "'Only accessible to institutions outside the United States' (Reg S non-US persons), KYC/AML'd by the fund administrator", checkedAt: 2026-10-13 }
  minimumInvestment:
    status: public
    value: 100000
    source: { url: "https://usyc.docs.hashnote.com/overview/investor-onboarding", checkedAt: 2026-10-13 }
  transferRestricted:
    value: true
    source: { url: "https://developers.circle.com/tokenized/usyc/smart-contracts", note: "transfer/transferFrom call authority.canCall on sender and receiver; role 0 (investor) has the transfer capability. 127 addresses held role 0 on Ethereum at review.", checkedAt: 2026-10-13 }

legal:
  vehicleType:
    status: public
    value: Cayman Islands exempted company, CIMA-registered mutual fund (reg. 2055432)
    source: { url: "https://api.gleif.org/api/v1/lei-records/25490083NU09WKP5Z570", note: "Token issuer: Circle International Bermuda Limited (BMA regulated), LEI 254900HOS8Z6JFRRCO30", checkedAt: 2026-10-13 }
  jurisdiction:
    status: public
    value: Cayman Islands (fund); Bermuda (token issuer)
    source: { url: "https://developers.circle.com/tokenized/usyc/overview", checkedAt: 2026-10-13 }
  lei:
    status: public
    value: 25490083NU09WKP5Z570
    source: { url: "https://api.gleif.org/api/v1/lei-records/25490083NU09WKP5Z570", note: "Entity ACTIVE, registration LAPSED", checkedAt: 2026-10-13 }
  secFilings:
    status: not_public
    searchedAt: 2026-10-13
    note: No EDGAR filer for the fund. Other Hashnote vehicles and the parent Circle Internet Group (CIK 0001876042) file.
  offeringDocument:
    status: not_public
    searchedAt: 2026-10-13
    note: Available on request from customer-support@circle.com; Steakhouse quotes extracts
  auditedFinancials:
    status: not_public
    searchedAt: 2026-10-13
    note: "LlamaRisk: 'Cohen and Co is the designated auditor … though no reports have been published.'"
  insolvency:
    status: public
    value: "Claimed bankruptcy-remote: 'All investments in iSDYF are held bankruptcy-remote at our custodian, BNY Mellon, via primebroker, Marex … resolution of the iSDYF fund would be independent of any resolution or bankruptcy of Hashnote.' Written before the Circle acquisition."
    source: { url: "https://forum.arbitrum.foundation/t/hashnote-usyc-step-application/23587", checkedAt: 2026-10-13 }

freshnessClass:
  value: tbill-mmf
  source: { url: "https://developers.circle.com/tokenized/usyc/overview", note: "Short-duration Treasuries and reverse repo, earning about the overnight rate.", checkedAt: 2026-10-25 }

underlying:
  holdings:
    status: public
    value:
      asOf: 2026-10-25
      basis: mandate
      items:
        - type: government-bills
          pct: 100
          label: T-bills and Treasury reverse repo
    source: { url: "https://app.rwa.xyz/assets/USYC", note: "'USYC provides exposure to short duration US Treasuries and Reverse Repo on US Treasuries.' The issuer's price reports give only fund-level principal and interest; no holdings list or weights are public.", checkedAt: 2026-10-25 }
  wamDays:
    status: not_public
    searchedAt: 2026-10-25
  trackRecord:
    value: { since: 2023-03-17, losses: [] }
    source: { url: "https://usyc.hashnote.com/api/price-reports", note: "Fund incorporated 2023-03-17. Price reports rise steadily; no drop found.", checkedAt: 2026-10-25 }

counterparties:
  custodian:
    status: public
    value: bny
    source: { url: "https://forum.arbitrum.foundation/t/hashnote-usyc-step-application/23587", note: "Assets held at BNY Mellon through prime broker Marex (2024 statement, before the Circle acquisition).", checkedAt: 2026-10-25 }
  fundAdministrator:
    status: public
    value: nav-fund-services
    source: { url: "https://usyc.docs.hashnote.com/overview/service-providers", note: "Fund Administrator: NAV Consulting", checkedAt: 2026-10-25 }
  auditor:
    status: public
    value: cohen-and-co
    source: { url: "https://usyc.docs.hashnote.com/overview/service-providers", note: "Auditor: Cohen and Company. rwa.xyz lists Valaston International instead.", checkedAt: 2026-10-25 }
  transferAgent:
    status: public
    value: nav-fund-services
    source: { url: "https://kitchen.steakhouse.financial/p/usyc", note: "Per the offering summary, 'the share register must follow the blockchain'", checkedAt: 2026-10-13 }
  affiliated:
    value: []
    source: { url: "https://usyc.docs.hashnote.com/overview/service-providers", checkedAt: 2026-10-25 }
  settlementRails:
    value: [usdc]
    source: { url: "https://developers.circle.com/tokenized/usyc/overview", note: "Subscriptions and redemptions are in USDC.", checkedAt: 2026-10-25 }
  operators:
    - role: Prime broker
      name: Marex
      source: { url: "https://usyc.docs.hashnote.com/overview/service-providers", checkedAt: 2026-10-25 }
    - role: Bank
      name: Customers Bank
      source: { url: "https://usyc.docs.hashnote.com/overview/service-providers", checkedAt: 2026-10-25 }

control:
  audits:
    - auditor: Unnamed firm
      scope: USYC contracts
      date: 2024-03-01
      source: { url: "https://forum.arbitrum.foundation/t/hashnote-usyc-step-application/23587", note: "'USYC was last audited in March, 2024'; the report isn't published. Etherscan shows no audit for the current implementation.", checkedAt: 2026-10-25 }
  bugBounty:
    status: unknown
    note: Circle runs a HackerOne program; whether USYC is in scope isn't public.
  powersDocumented:
    value: false
    source: { url: "https://developers.circle.com/tokenized/usyc/smart-contracts", note: "Lists contract addresses only; no roles or powers.", checkedAt: 2026-10-25 }
  signersIndependent:
    status: not_public
    searchedAt: 2026-10-25
  chains:
    - chain: ethereum
      mechanism: native+bridge
      provider: Circle CCTP, a TokenManagerProxy (likely Axelar)
      source: { url: "https://developers.circle.com/tokenized/usyc/smart-contracts", note: "Both hold unlimited minter allowances on the Ethereum token.", checkedAt: 2026-10-25 }
    - chain: bsc, arc, solana
      mechanism: native
      provider: Circle
      source: { url: "https://developers.circle.com/tokenized/usyc/smart-contracts", checkedAt: 2026-10-25 }

transparency:
  reports:
    - name: Hashnote price reports
      provider: hashnote
      dataSource: issuer
      granularity: nav
      frequency: daily
      verifiability: self-reported
      onchain: true
      source: { url: "https://usyc.hashnote.com/api/price-reports", note: "Fund-level principal, interest and balance, posted by the fund-admin key. No holdings list or third-party attestation found.", checkedAt: 2026-10-25 }
      feed: { chain: ethereum, address: "0x74f2199AEb743f68f05943e5715A33EaF2b61f53" }
  eventReporting:
    status: unknown
    note: Only asked for private credit.

pricing:
  reference:
    type: oracle
    provider: hashnote
    chain: ethereum
    address: "0x74f2199AEb743f68f05943e5715A33EaF2b61f53"
    writer: eoa
    dataOrigin: issuer
    cadenceSeconds: 86400
    businessDaysOnly: true
    historyOnchain: true
    source: { url: "https://usyc.docs.hashnote.com/overview/token-price", note: "GenericNextPriceAggregator (UUPS, 18 decimals), read by the Tellers. transmit() is callable only by PriceReporter 0x9fde…23d7, whose transmitCall is restricted to the fund admin (EOA 0xdbe0…800d, which sent the last report). Updates once per business day around 9am ET; none on weekends or US Federal holidays. The legacy SDYCAggregatorProxy 0x4c48…8b3e, owned by the same EOA, is the feed Usual reads.", checkedAt: 2026-10-13 }
  stalenessDetectable:
    value: true
    source: { url: "https://usyc.docs.hashnote.com/overview/token-price", note: "latestRoundData returns the report's updatedAt.", checkedAt: 2026-10-25 }
  lossRecognition:
    value: next-nav
    source: { url: "https://usyc.docs.hashnote.com/overview/token-price", note: "Price set once per business day after the prime broker reports.", checkedAt: 2026-10-25 }

exit:
  redemption:
    available:
      value: true
      source: { url: "https://usyc.docs.hashnote.com/overview/subscription-and-redemption", note: "Onchain through the Teller (redeem(shares, receiver, account)) into USDC, 24/7/365", checkedAt: 2026-10-13 }
    whoCanRedeem:
      value: whitelisted-holders
      source: { url: "https://developers.circle.com/tokenized/usyc/subscribe-and-redeem", note: "Role 0 has the redeem capability on Teller 0xeE35…30e6", checkedAt: 2026-10-13 }
    settlement:
      status: public
      value: T+0
      source: { url: "https://developers.circle.com/tokenized/usyc/overview", note: "'Subscriptions and redemptions settle atomically in real time (T+0)', while treasury liquidity lasts; beyond that, 'please contact us'", checkedAt: 2026-10-13 }
    gatesOrSuspension:
      status: not_public
      searchedAt: 2026-10-13
      note: Fund-level suspension terms are in the offering memorandum, which is not public. Onchain, the fund-admin EOA can pause Entitlements (blocks every transfer and redemption) and set per-account limits instantly.
  dealing:
    value: continuous
    source: { url: "https://developers.circle.com/tokenized/usyc/overview", note: "Teller redeems 24/7, atomically, while treasury liquidity lasts.", checkedAt: 2026-10-25 }
  noticeDays:
    status: public
    value: 0
    source: { url: "https://developers.circle.com/tokenized/usyc/overview", checkedAt: 2026-10-25 }
  lockupDays:
    status: public
    value: 0
    source: { url: "https://developers.circle.com/tokenized/usyc/overview", checkedAt: 2026-10-25 }
  dailyCapUsd:
    status: not_public
    searchedAt: 2026-10-25
    note: Per-account limits are set by the fund admin; 'If you require more liquidity on a specific day, please contact us'.
  minimumUsd:
    status: public
    value: 0
    source: { url: "https://app.rwa.xyz/assets/USYC", checkedAt: 2026-10-25 }
  feeBps:
    status: public
    value: 0
    source: { url: "https://usyc.docs.hashnote.com/overview/fees", note: "3 bps on redemptions above $1M a day.", checkedAt: 2026-10-25 }
  liquidators:
    value: allowlisted
    source: { url: "https://developers.circle.com/tokenized/usyc/overview", note: "Transfers check the Entitlements allowlist on both sides. Aave Horizon's aUSYC holds the custodian role.", checkedAt: 2026-10-25 }
  instant:
    - label: USYC Teller (USDC from the Circle treasury wallet)
      chain: ethereum
      address: "0xeE35F963BFC71b51eC95147f26c030D674ea30e6"
      dailyCapUsd:
        status: not_public
        searchedAt: 2026-10-13
      fundedUsd:
        status: public
        value: 38304339
        source: { url: "https://etherscan.io/address/0xeE35F963BFC71b51eC95147f26c030D674ea30e6", note: "totalAssets = min(treasury USDC 42.43M, allowance 38.30M); topped up by hand.", checkedAt: 2026-10-13 }

