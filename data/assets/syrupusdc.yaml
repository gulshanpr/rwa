        "0x2eFFf88747EB5a3FF00d4d8d0f0800E306C0426b": Maple GovernorTimelock
        "0x804a6f5f667170f545bf14e5ddb48c70b788390c": MapleGlobals
        "0x7aD5fFa5fdF509E30186F4609c2f6269f4B6158F": PoolManager
