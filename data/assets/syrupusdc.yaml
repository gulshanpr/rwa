# Synced with Postgres. Edit in /admin and run `bun rwa export`, or edit here and run `bun rwa import`.
slug: syrupusdc
name: Syrup USDC
ticker: syrupUSDC
assetClass: private-credit
description: >
  Share in a Maple USDC lending pool (ERC-4626). Its value grows with interest from overcollateralized loans to crypto institutions and from Aave and Sky strategies. It is not a stablecoin.
issuer: maple-international-operations-spc
manager: maple
platform: maple
tokenStandard: erc4626
priceModel: accumulating-nav

deployments:
  - chain: ethereum
    token: "0x80ac24aA929eaF5013f6436cdA2a7ba190f5Cc0b"
    discovery:
      ignoreMethods: []
      labels:
        "0xC1e18FFD8825FfB286D177DDEbeba345EC70B49f": Pool delegate (single wallet)
        "0x6b1A78C1943b03086F7Ee53360f9b0672bD60818": Maple SecurityAdmin Safe
