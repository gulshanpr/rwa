        "0x4f6F1d5eFd38130120dd6e7f820E8F8048ccaA1B": Permission admin (single wallet)
        "0x54b130c704919320E17F4F1Ffa4832A91AB29Dca": Permission admin (single wallet)

access:
  investorType:
    value: non-us-persons
    source: { url: "https://docs.maple.finance/legal/interface-terms-of-use-syrupusdc-and-syrupusdt", note: "US, Australia and sanctioned jurisdictions excluded; 18+; no accreditation stated", checkedAt: 2026-10-12 }
  minimumInvestment:
    status: not_public
    searchedAt: 2026-10-12
  transferRestricted:
    value: false
    source: { url: "https://etherscan.io/address/0xbe10adce8b6e3e02db384e7fada5395dd113d8b3#readProxyContract", note: "PoolPermissionManager permissionLevels(PoolManager) = 1 (function level) and poolBitmaps for P:transfer = 0, so any address can transfer. Deposits need bitmap 16. The pool delegate can change this.", checkedAt: 2026-10-12 }

legal:
  vehicleType:
    status: public
    value: Segregated portfolio (Secured Loan Segregated Portfolio 1) of a Cayman segregated portfolio company
    source: { url: "https://docs.maple.finance/legal/interface-terms-of-use-syrupusdc-and-syrupusdt", checkedAt: 2026-10-12 }
  jurisdiction:
    status: public
    value: Cayman Islands
    source: { url: "https://search.gleif.org/#/record/984500AEHEB0A6C97D08", note: "Registration no. 410607, George Town", checkedAt: 2026-10-12 }
  lei:
    status: public
    value: 984500AEHEB0A6C97D08
    source: { url: "https://search.gleif.org/#/record/984500AEHEB0A6C97D08", note: "LEI of the SPC. Secured Loan Segregated Portfolio 1 has no LEI of its own.", checkedAt: 2026-10-12 }
  secFilings:
    status: not_public
    searchedAt: 2026-10-12
    note: No EDGAR filer found for Maple International Operations SPC
  offeringDocument:
    status: not_public
    searchedAt: 2026-10-12
    note: Only the Interface Terms and Risk Disclosures are public; no offering memorandum
  auditedFinancials:
    status: not_public
    searchedAt: 2026-10-12
  insolvency:
    status: public
    value: Assets and liabilities of each segregated portfolio are ring-fenced by statute; lender claims are only against the portfolio they deposited in. Bankruptcy remoteness is not claimed in those words.
    source: { url: "https://docs.maple.finance/legal/syrupusdc-and-syrupusdt-risks", checkedAt: 2026-10-12 }

freshnessClass:
  value: short-duration-credit
  source: { url: "https://governance.aave.com/t/syrup-usdc-syrupusdc-on-aave-arc-assessments/25729/2", note: "Open-term, overcollateralized loans that borrowers can be asked to repay within 2 to 30 days.", checkedAt: 2026-10-25 }

underlying:
  holdings:
    status: public
    value:
      asOf: 2026-09-23
      items:
        - type: secured-loans
          pct: 99.3
          label: Overcollateralized loans to crypto institutions
        - type: stablecoin
          pct: 0.7
          label: Idle USDC
    source: { url: "https://governance.aave.com/t/syrup-usdc-syrupusdc-on-aave-arc-assessments/25729/2", note: "LlamaRisk: loans are 99.3% of $1.00B in assets, 7.4M USDC cash, no balance in the DeFi strategies (2026-09-23).", checkedAt: 2026-10-25 }
  wamDays:
    status: not_public
    searchedAt: 2026-10-25
    note: Loans are open-term; borrower notice up to 30 days.
  securedPct:
    status: public
    value: 99.3
    source: { url: "https://static-r2.jup.ag/lend/risk-research/maple-risk-report.pdf", note: "Every loan is overcollateralized (150% to 205%) with BTC, XRP, stablecoins and others, held at Anchorage and BitGo (Feb 2026).", checkedAt: 2026-10-25 }
  largestObligorPct:
    status: public
    value: 17.4
    source: { url: "https://static-r2.jup.ag/lend/risk-research/maple-risk-report.pdf", note: "Largest position $145M of $831M (17.4%) on 2026-02-14, for Maple's syrupUSD book. Loans have since grown from 37% to 99% of the pool, so this may have changed.", checkedAt: 2026-10-25 }
  obligors:
    status: public
    value: 27
    source: { url: "https://static-r2.jup.ag/lend/risk-research/maple-risk-report.pdf", note: "27 institutional borrowers (2026-02-14).", checkedAt: 2026-10-25 }
  trackRecord:
    value: { since: 2024-05-28, losses: [] }
    source: { url: "https://static-r2.jup.ag/lend/risk-research/maple-risk-report.pdf", note: "'zero losses since inception'; in Feb 2025, 35% of loans got margin calls and every borrower topped up. Maple's 2022 Orthogonal default was in an older, separate pool.", checkedAt: 2026-10-25 }

counterparties:
  custodian:
    status: not_public
    searchedAt: 2026-10-25
    note: Pool cash sits in Maple's contracts. Only the borrowers' collateral has named custodians.
  fundAdministrator:
    status: not_public
    searchedAt: 2026-10-25
  auditor:
    status: not_public
    searchedAt: 2026-10-25
    note: Smart contract audits only; no financial audit of the segregated portfolio.
  transferAgent:
    status: not_public
    searchedAt: 2026-10-12
    note: Not applicable. syrupUSDC is a plain ERC-20 with no transfer agent.
  affiliated:
    value: []
    source: { url: "https://app.rwa.xyz/assets/syrupUSDC", note: "No providers are named.", checkedAt: 2026-10-25 }
  settlementRails:
    value: [usdc]
    source: { url: "https://docs.maple.finance/legal/syrupusdc-and-syrupusdt-risks", note: "A USDC lending pool.", checkedAt: 2026-10-25 }
  operators:
    - role: Collateral custodians
      name: Anchorage Digital, BitGo, Zodia Custody
      source: { url: "https://governance.aave.com/t/syrup-usdc-syrupusdc-on-aave-arc-assessments/25729/2", checkedAt: 2026-10-25 }
    - role: Pool delegate and underwriter
      name: Maple Direct
      source: { url: "https://static-r2.jup.ag/lend/risk-research/maple-risk-report.pdf", checkedAt: 2026-10-25 }

control:
  audits:
    - auditor: Sigma Prime
      scope: CCIP Receiver
      date: 2026-01-01
      source: { url: "https://docs.maple.finance/technical-resources/security/security", note: "18 reports across 8 release cycles by 7 firms; WithdrawalManager upgrade by Spearbit and Sherlock in 2025-11.", checkedAt: 2026-10-25 }
  bugBounty:
    status: public
    value: { platform: Immunefi, maxUsd: 500000 }
    source: { url: "https://governance.aave.com/t/syrup-usdc-syrupusdc-on-aave-arc-assessments/25729/2", checkedAt: 2026-10-25 }
  powersDocumented:
    value: true
    source: { url: "https://docs.maple.finance/technical-resources/admin-functions/governor-admin-actions", note: "Governor, Security Admin, Operational Admin and pool delegate powers are documented.", checkedAt: 2026-10-25 }
  signersIndependent:
    status: not_public
    searchedAt: 2026-10-25
  chains:
    - chain: ethereum
      mechanism: native
      provider: Maple
      source: { url: "https://docs.maple.finance/integrate/crosschain/syrupusd-crosschain", note: "The pool itself; copies elsewhere are backed by tokens locked here.", checkedAt: 2026-10-25 }
    - chain: arbitrum, base, ink, monad, tempo, robinhood chain, arc, solana
      mechanism: bridged
      provider: Chainlink CCIP
      source: { url: "https://docs.maple.finance/integrate/crosschain/syrupusd-crosschain", checkedAt: 2026-10-25 }

transparency:
  reports:
    - name: The Network Firm proof of reserves
      provider: the-network-firm
      dataSource: independent
      granularity: position
      frequency: unstated
      verifiability: attestation
      onchain: false
      source: { url: "https://maple.finance/insights/introducing-proof-of-reserves", note: "Collateral value and custodian confirmation for each loan, sourced from the custodians. Cadence 'every cycle', not stated.", checkedAt: 2026-10-25 }
    - name: Maple loan book
      provider: maple
      dataSource: issuer
      granularity: position
      frequency: realtime
      verifiability: self-reported
      onchain: true
      source: { url: "https://docs.maple.finance/integrate/ethereum-mainnet/asset-integration", note: "Loan accounting and impairments are onchain; collateral details are self-reported.", checkedAt: 2026-10-25 }
  eventReporting:
    status: public
    value: true
    source: { url: "https://docs.maple.finance/integrate/ethereum-mainnet/asset-integration", note: "impairLoan and triggerDefault are onchain events that move the exit rate at once.", checkedAt: 2026-10-25 }

pricing:
  reference:
    type: vault
    provider: maple
    chain: ethereum
    address: "0x80ac24aA929eaF5013f6436cdA2a7ba190f5Cc0b"
    method: convertToExitAssets(shares), from PoolManager totalAssets() minus unrealizedLosses()
    writer: eoa
    dataOrigin: issuer
    historyOnchain: true
    source: { url: "https://eth.blockscout.com/address/0xbAD003DA1e107f537Ae2f687f5FE7a7aFFe9B241?tab=contract", note: "LoanManager.impairLoan can be called by the pool delegate (an EOA) or the governor and writes the NAV down at once. Interest accrues per second from Maple's own loan accounting.", checkedAt: 2026-10-12 }
  stalenessDetectable:
    value: true
    source: { url: "https://docs.maple.finance/integrate/ethereum-mainnet/asset-integration", note: "The vault computes its rate every block.", checkedAt: 2026-10-25 }
  lossRecognition:
    value: delayed
    source: { url: "https://docs.maple.finance/integrate/ethereum-mainnet/asset-integration", note: "convertToExitAssets nets out impairments at once, but Morpho's oracles read convertToAssets, which ignores unrealized losses until a default is realized.", checkedAt: 2026-10-25 }
  secondaryDiscount:
    status: public
    value: { maxPct: 0.22, window: "Ethereum DEXs, to 2026-09-23" }
    source: { url: "https://governance.aave.com/t/syrup-usdc-syrupusdc-on-aave-arc-assessments/25729/2", note: "Mean discount about 9 bps; widest 22 bps on 2026-04-20.", checkedAt: 2026-10-25 }

exit:
  redemption:
    available:
      value: true
      source: { url: "https://docs.maple.finance/legal/syrupusdc-and-syrupusdt-risks", note: "FIFO queue in WithdrawalManagerQueue 0x1bc47a0Dd0FdaB96E9eF982fdf1F34DC6207cfE3", checkedAt: 2026-10-12 }
    whoCanRedeem:
      value: all-holders
      source: { url: "https://etherscan.io/address/0xbe10adce8b6e3e02db384e7fada5395dd113d8b3#readProxyContract", note: "poolBitmaps for P:requestRedeem and P:redeem = 0 at block 26,176,570, so any holder (including a liquidator) can queue a redemption. The pool delegate can change this.", checkedAt: 2026-10-12 }
    settlement:
      status: not_public
      searchedAt: 2026-10-12
      note: "'Currently processed on average in less than 24 hours, this is not guaranteed'"
    gatesOrSuspension:
      status: public
      value: issuer-discretion
      source: { url: "https://docs.maple.finance/legal/syrupusdc-and-syrupusdt-risks", note: "'There is no guaranteed maximum withdrawal period.' Requests only settle when the pool delegate, OperationalAdmin or a Maple-registered redeemer calls processRedemptions (WithdrawalManagerQueue source).", checkedAt: 2026-10-12 }
  dealing:
    value: continuous
    source: { url: "https://app.rwa.xyz/assets/syrupUSDC", note: "FIFO queue: 'Most withdrawals are processed in under 24 hours, but could take up to 30 days.'", checkedAt: 2026-10-25 }
  noticeDays:
    status: public
    value: 0
    source: { url: "https://app.rwa.xyz/assets/syrupUSDC", checkedAt: 2026-10-25 }
  lockupDays:
    status: public
    value: 0
    source: { url: "https://app.rwa.xyz/assets/syrupUSDC", checkedAt: 2026-10-25 }
  dailyCapUsd:
    status: public
    value: null
    source: { url: "https://docs.maple.finance/legal/syrupusdc-and-syrupusdt-risks", note: "No cap, but 'no guaranteed maximum withdrawal period'.", checkedAt: 2026-10-25 }
  minimumUsd:
    status: public
    value: 0
    source: { url: "https://app.rwa.xyz/assets/syrupUSDC", checkedAt: 2026-10-25 }
  feeBps:
    status: public
    value: 0
    source: { url: "https://app.rwa.xyz/assets/syrupUSDC", checkedAt: 2026-10-25 }
  liquidators:
    value: anyone
    source: { url: "https://etherscan.io/address/0xbe10adce8b6e3e02db384e7fada5395dd113d8b3#readProxyContract", note: "Transfers are open today (bitmap 0); the pool delegate could restrict them.", checkedAt: 2026-10-25 }
  instant: []

