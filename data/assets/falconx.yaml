# Synced with Postgres. Edit in /admin and run `bun rwa export`, or edit here and run `bun rwa import`.
slug: falconx
name: FalconX Credit Vault
ticker: AA_FalconXUSDC
assetClass: private-credit
description: >
  Senior tranche of the FalconX credit vault on Pareto. USDC is lent to one FalconX borrower wallet, which funds prime-brokerage credit lines. Collateral sits offchain. The junior tranche has no tokens outstanding, so there is no onchain first-loss buffer. This is the vault FalconX announced and that rwa.xyz lists as AA_FalconXUSDC, not Plume's NFALCON or Sygnum's Desygnate. A deprecated Pareto deployment on Optimism is not tracked.
issuer: falconx-credit-vault
manager: m11-credit
platform: pareto
tokenStandard: custom
priceModel: accumulating-nav

deployments:
  - chain: ethereum
    token: "0xC26A6Fa2C37b38E549a4a1807543801Db684f99C"
    discovery:
      ignoreMethods: []
      labels:
        "0x433D5B175148dA32Ffe1e1A37a939E1b7e79be4d": FalconX credit vault (IdleCDO)
        "0x17E9Ab2992dfecBe779a06A92a6cDB9fE6aEeEf3": IdleCreditVault strategy
        "0xfb3bd022d5dacf95ee28a6b07825d4ff9c5b3814": Vault owner Safe (3 of 6)
        "0xCFbFaC74C26F8647cBDb8c5caf80BB5b32E43134": Gnosis AllowanceModule on the owner Safe
        "0x1fb0f3602f52e2420acff5cf04dbfde96378df58": Epoch operator (single wallet)
        "0xc08f538b079be6edfb6594985e8b93784f41a2c6": Borrower wallet (single wallet)
        "0xacbb25b7dd30b6b2f7131865dc1023622de3b3d6": Junior tranche (supply 0 at review)
        "0xda86e15d0cda3a05db930b248d7a2f775e575a44": Upgrade timelock (1 day)

