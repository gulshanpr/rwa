    status: not_public
    searchedAt: 2026-10-14
    note: The lending entity's legal name was not found. rwa.xyz gives a domicile only.
  jurisdiction:
    status: public
    value: Republic of the Marshall Islands
    source: { url: "https://app.rwa.xyz/assets/AA_FalconXUSDC", note: "Disputes are listed as United Kingdom. The legal entity name is not public, so the legal-entity disclosure check still fails.", checkedAt: 2026-10-14 }
  lei:
    status: not_public
    searchedAt: 2026-10-14
  secFilings:
    status: not_public
    searchedAt: 2026-10-14
