pricing:
  reference:
    type: oracle
    provider: pareto
    chain: ethereum
    address: "0x433D5B175148dA32Ffe1e1A37a939E1b7e79be4d"
    writer: eoa
    dataOrigin: issuer
    cadenceSeconds: 2721600
    read:
      decimals: 6
      value: { fn: "function priceAA() view returns (uint256)" }
      updatedAt: { fn: "function latestHarvestBlock() view returns (uint256)" }
    historyOnchain: false
    source: { url: "https://docs.pareto.credit/developers/addresses/product/credit-vaults", note: "priceAA is USDC per token (6 decimals), set when the operator stops the epoch from interest the borrower pays. latestHarvestBlock stores a timestamp despite the name. The contract management fee is 200 / 100000 = 0.20% per year. The performance fee in the contract was 0; rwa.xyz says 10%. Morpho's funded USDC market reads that same price through TranchesChainlinkOracle 0x50449B3D1f5931d568A1951Ee506A9534e7f7dFf (cdo() is this vault).", checkedAt: 2026-10-14 }

verification:
  methods:
    - type: self-reported
      provider: pareto
      independent: false
      assetLevel: false
      frequency: monthly
      publicReport: true
      feed: { chain: ethereum, address: "0x433D5B175148dA32Ffe1e1A37a939E1b7e79be4d" }
      source: { url: "https://docs.pareto.credit/developers/addresses/product/credit-vaults", note: "The only onchain figure is the vault's own price. No independent asset-level attestation was found. A real-time risk engine is claimed and not published onchain.", checkedAt: 2026-10-14 }

portfolio:
  collateral:
    status: public
    value: None onchain. USDC is lent to a single FalconX borrower wallet; collateral sits offchain with FalconX and isn't itemised
    source: { url: "https://artifacts.llama.fi/pdf-exports/0b2211d5-c314-4e7a-97d3-42c6cbf37e7f.pdf", checkedAt: 2026-10-14 }
  largestExposurePct:
    status: public
    value: 100
    source: { url: "https://artifacts.llama.fi/pdf-exports/0b2211d5-c314-4e7a-97d3-42c6cbf37e7f.pdf", note: "The vault lends to one borrower, FalconX (borrower wallet 0xc08f538b079be6edfb6594985e8b93784f41a2c6)", checkedAt: 2026-10-14 }
  firstLoss:
    status: public
    value: Marketed as an equity tranche, but the junior (BB) tranche supply is 0 onchain, so any first-loss capital sits offchain
    source: { url: "https://artifacts.llama.fi/pdf-exports/0b2211d5-c314-4e7a-97d3-42c6cbf37e7f.pdf", note: "getCurrentAARatio = 100% onchain", checkedAt: 2026-10-14 }

