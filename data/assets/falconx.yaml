transparency:
  reports:
    - name: Pareto vault reporting
      provider: pareto
      dataSource: issuer
      granularity: nav
      frequency: monthly
      verifiability: self-reported
      onchain: true
      source: { url: "https://app.rwa.xyz/assets/AA_FalconXUSDC", note: "Interest reported by the borrower and set at each epoch; no independent attestation found.", checkedAt: 2026-10-25 }
      feed: { chain: ethereum, address: "0x433D5B175148dA32Ffe1e1A37a939E1b7e79be4d" }
  eventReporting:
    status: not_public
    searchedAt: 2026-10-25

pricing:
  reference:
    type: oracle
    provider: pareto
    chain: ethereum
    address: "0x433D5B175148dA32Ffe1e1A37a939E1b7e79be4d"
    writer: eoa
    dataOrigin: issuer
    cadenceSeconds: 2721600
    read:
      decimals: 6
      value: { fn: function priceAA() view returns (uint256) }
      updatedAt:
        fn: function latestHarvestBlock() view returns (uint256)
    historyOnchain: false
    source: { url: "https://docs.pareto.credit/developers/addresses/product/credit-vaults", note: "priceAA is USDC per token (6 decimals), set when the operator stops the epoch from interest the borrower pays. latestHarvestBlock stores a timestamp despite the name. The contract management fee is 200 / 100000 = 0.20% per year. The performance fee in the contract was 0; rwa.xyz says 10%. Morpho's funded USDC market reads that same price through TranchesChainlinkOracle 0x50449B3D1f5931d568A1951Ee506A9534e7f7dFf (cdo() is this vault).", checkedAt: 2026-10-14 }
  stalenessDetectable:
    value: false
    source: { url: "https://etherscan.io/address/0x433D5B175148dA32Ffe1e1A37a939E1b7e79be4d", note: "The tranche price getter carries no timestamp; it only changes at epoch end.", checkedAt: 2026-10-25 }
  lossRecognition:
    value: next-nav
    source: { url: "https://etherscan.io/address/0x433D5B175148dA32Ffe1e1A37a939E1b7e79be4d", note: "Write-offs land at the next monthly epoch.", checkedAt: 2026-10-25 }

exit:
