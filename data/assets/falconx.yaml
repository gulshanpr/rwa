      value: true
      source: { url: "https://app.rwa.xyz/assets/AA_FalconXUSDC", note: "Monthly, with 31 days' notice. Fee 0. An instant-withdraw window exists in the contract (3-day delay) but it is limited and was closed at review (deadline 2026-10-04).", checkedAt: 2026-10-14 }
    whoCanRedeem:
      value: whitelisted-holders
      source: { url: "https://app.rwa.xyz/assets/AA_FalconXUSDC", checkedAt: 2026-10-14 }
    settlement:
      status: public
      value: T+31
      source: { url: "https://app.rwa.xyz/assets/AA_FalconXUSDC", note: "31-day notice, then the monthly epoch. epochDuration is 2,721,600 seconds (31.5 days).", checkedAt: 2026-10-14 }
    minimum:
      value: 250000
      source: { url: "https://app.rwa.xyz/assets/AA_FalconXUSDC", note: "250,000 USDC.", checkedAt: 2026-10-14 }
    gatesOrSuspension:
      status: public
      value: issuer-discretion
      source: { url: "https://etherscan.io/address/0x433D5B175148dA32Ffe1e1A37a939E1b7e79be4d#code", note: "The owner Safe can pause or call emergencyShutdown with no published limit. Separately, startEpoch pauses deposits and turns withdrawal requests off until the epoch stops. That is why the vault reads as paused while an epoch is running. Legal suspension terms were not found.", checkedAt: 2026-10-14 }
  instantLiquidity: []

openQuestions:
  - "The lending entity's legal name, custodian, administrator, auditor, offering documents and LEI."
  - "Whether the busy Safe owners are personal keys or MPC wallets, and the allowance-module delegates."
  - "rwa.xyz shows a 7-day APY of −3.82% and slightly lower supply than the chain."
  - "The 10% performance fee doesn't match the contract, which reads 0."
  - "The guardian can be changed with no event and no getter, so it may no longer be the owner."

