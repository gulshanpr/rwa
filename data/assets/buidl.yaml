slug: buidl
name: BlackRock USD Institutional Digital Liquidity Fund
ticker: BUIDL
assetClass: us-treasuries
description: >
  Tokenized BVI fund that seeks a stable $1.00 NAV and invests 100% of its assets in cash, US Treasury bills, notes and repurchase agreements. Yield is paid monthly as new tokens.
issuer: blackrock-buidl-fund-ltd
manager: blackrock
platform: securitize
