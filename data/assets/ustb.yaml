    value: qualified-purchaser
    source: { url: "https://superstate.com/assets/ustb", note: "Accredited Investors and Qualified Purchasers; US persons are eligible", checkedAt: 2026-10-13 }
  minimumInvestment:
    status: public
    value: 100000
    source: { url: "https://docs.superstate.com/investors/tokenized-funds/available-funds/invesco-ustb", note: "$100,000 initial, unless Superstate waives it", checkedAt: 2026-10-13 }
  transferRestricted:
    value: true
    source: { url: "https://docs.superstate.com/investors/tokenized-funds/available-funds/invesco-ustb", note: "Every transfer, mint, subscribe, bridge and redeem checks the allowlist. The token reads AllowlistV4 0xBcBC2b4F…8D1f (allowlist() at block 26,183,016).", checkedAt: 2026-10-13 }

