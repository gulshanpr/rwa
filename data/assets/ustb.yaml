  fundAdministrator:
    status: public
    value: nav-fund-services
    source: { url: "https://superstate.com/assets/ustb", note: "NAV Fund Services / NAV Consulting, Inc., the NAV calculation agent", checkedAt: 2026-10-13 }
  auditor:
    status: public
    value: pwc
    source: { url: "https://superstate.com/assets/ustb", note: "Ernst & Young until March 2026", checkedAt: 2026-10-13 }
  transferAgent:
    status: public
    value: superstate
    source: { url: "https://superstate.com/assets/ustb", note: "Superstate Services LLC", checkedAt: 2026-10-13 }

legal:
  vehicleType:
    status: public
    value: Series of a Delaware statutory trust (Superstate Asset Trust)
    source: { url: "https://superstate.com/assets/ustb", checkedAt: 2026-10-13 }
  jurisdiction:
    status: public
    value: Delaware, United States
    source: { url: "https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0002004367", checkedAt: 2026-10-13 }
  lei:
    status: not_public
    searchedAt: 2026-10-13
    note: No LEI for the USTB series. Superstate Asset Trust itself is 254900HBBFFSKNX6LZ37 (ACTIVE).
  secFilings:
    status: public
    value: { cik: "0002004367", forms: [D, D/A] }
    source: { url: "https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0002004367", note: "Form D 2024-01-02; D/A through 2026-07-14", checkedAt: 2026-10-13 }
  offeringDocument:
    status: not_public
    searchedAt: 2026-10-13
    note: Fund documents are only in the Superstate Investor Portal
  auditedFinancials:
    status: not_public
    searchedAt: 2026-10-13
  insolvency:
    status: not_public
    searchedAt: 2026-10-13
