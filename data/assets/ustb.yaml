slug: ustb
name: Invesco Short Duration US Government Securities Fund
ticker: USTB
assetClass: us-treasuries
description: >
  Tokenized private fund (formerly the Superstate Short Duration US Government Securities Fund) that holds short-term US Treasury bills. Interest accrues into a rising NAV per share, which started at $10.
issuer: superstate-ustb-fund
manager: invesco
platform: superstate
tokenStandard: custom
priceModel: accumulating-nav

deployments:
  - chain: ethereum
    token: "0x43415eB6ff9DB7E26A15b704e7A3eDCe97d31C4e"
    discovery:
      ignoreMethods: []
      labels:
        "0xad309BB6f13074128b4F23EF9EA2fe8552AfCA83": Superstate admin key (token + ProxyAdmin owner)
        "0x4B1df64357a5D484563c9b7c16a80eD8B8fB1395": NAV checkpoint writer (oracle owner)
        "0x7747940aDBc7191f877a9B90596E0DA4f8deb2Fe": Allowlist owner
        "0xb9d285DCaD879513DC9c1A3b2e0CCcB21c3c2146": USTB ProxyAdmin
        "0xBcBC2b4FB2AbE1C598C9ea91E0b03338e4728D1f": AllowlistV4
        "0xE4fA682f94610cCd170680cc3B045d77D9E528a8": SuperstateOracle

