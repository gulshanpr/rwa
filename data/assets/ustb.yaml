    - auditor: "0xMacro"
      scope: Superstate AllowlistV3
      date: 2025-07-31
      source: { url: "https://0xmacro.com/library/audits/superstate-9", note: "Most recent of the 0xMacro reports that covers the USTB stack; reports 10 and 11 cover equity tokens.", checkedAt: 2026-10-25 }
  bugBounty:
    status: not_public
    searchedAt: 2026-10-25
    note: Superstate's investor security page says it has no formal reward policy.
  powersDocumented:
    value: false
    source: { url: "https://docs.superstate.com/investors/smart-contracts", note: "Docs cover minting, allowlist changes and forced burns by the 'Superstate Admin Address', but not upgrades, pausing or the oracle.", checkedAt: 2026-10-25 }
  signersIndependent:
    status: not_public
    searchedAt: 2026-10-25
  chains:
    - chain: ethereum
      mechanism: native
      provider: Superstate
      source: { url: "https://docs.superstate.com/investors/smart-contracts", note: "Issued by Superstate on each chain; crosschain moves are an issuer burn and mint, not a third-party bridge.", checkedAt: 2026-10-25 }
    - chain: solana, plume
      mechanism: native
      provider: Superstate
      source: { url: "https://docs.superstate.com/investors/smart-contracts", checkedAt: 2026-10-25 }

transparency:
  reports:
    - name: Chronicle Proof of Asset
      provider: chronicle
      dataSource: custodian
      granularity: position
      frequency: daily
      verifiability: cryptographic
      onchain: true
      source: { url: "https://docs.chroniclelabs.org/Products/proofOfAsset/integratingPOAs/routers", note: "Router 0xDf8d…f254 is live; its age advanced about every 23.7h, weekends included (checked 2026-10-13).", checkedAt: 2026-10-25 }
      feed: { chain: ethereum, address: "0xDf8deCbDB89C95297ee6ef816Bd8A7B66973f254" }
    - name: Superstate holdings page
      provider: superstate
      dataSource: issuer
      granularity: position
      frequency: unstated
      verifiability: self-reported
      onchain: false
      source: { url: "https://superstate.com/assets/ustb", note: "Line-item T-bill holdings, 'As of 09/21/2026' when checked on 2026-10-25.", checkedAt: 2026-10-25 }
  eventReporting:
    status: unknown
    note: Only asked for private credit.

pricing:
  reference:
    type: oracle
    provider: superstate
    chain: ethereum
    address: "0xE4fA682f94610cCd170680cc3B045d77D9E528a8"
    writer: eoa
    dataOrigin: fund-administrator
    cadenceSeconds: 86400
    businessDaysOnly: true
    read:
      decimals: 6
      value: { fn: "function latestRoundData() view returns (uint80, int256, uint256, uint256, uint80)", index: 1 }
      updatedAt:
        fn: function checkpoints(uint256) view returns (uint64, uint64, uint128)
        args: [$value.0]
        index: 1
    historyOnchain: true
    source: { url: "https://docs.superstate.com/investors/smart-contracts", note: "SuperstateOracle; owner EOA 0x4b1d…1395 posts one checkpoint per business day (NAV/S from NAV Fund Services). latestRoundData() extrapolates between checkpoints and returns the current block time as updatedAt, so freshness is read from checkpoints(roundId).effectiveAt. Each checkpoint may move at most maximumAcceptablePriceDelta ($1.00, about 9%); the oracle reverts if the newest checkpoint is over 5 days old.", checkedAt: 2026-10-13 }
  stalenessDetectable:
    value: false
    source: { url: "https://github.com/superstateinc/onchain-redemptions/blob/5986d9b692aff3a333d6042361af0d31521a78f0/src/oracle/SuperstateOracle.sol", note: "SuperstateOracle extrapolates between checkpoints and returns the current block time as updatedAt. It only reverts once the latest checkpoint is 5 days old.", checkedAt: 2026-10-25 }
  lossRecognition:
    value: next-nav
    source: { url: "https://docs.superstate.com/investors/smart-contracts", note: "One NAV checkpoint per business day.", checkedAt: 2026-10-25 }

exit:
  redemption:
    available:
      value: true
      source: { url: "https://docs.superstate.com/investors/tokenized-funds/available-funds/invesco-ustb", note: "USD wire, or USDC through the portal or onchain redeem on RedemptionIdle", checkedAt: 2026-10-13 }
    whoCanRedeem:
      value: whitelisted-holders
      source: { url: "https://docs.superstate.com/investors/tokenized-funds/available-funds/invesco-ustb", checkedAt: 2026-10-13 }
    settlement:
      status: public
      value: T+0
      source: { url: "https://docs.superstate.com/investors/tokenized-funds/available-funds/invesco-ustb", note: "USDC 'immediately (including non-business days, subject to available liquidity)'; USD same day if requested before 1pm ET", checkedAt: 2026-10-13 }
    gatesOrSuspension:
      status: not_public
      searchedAt: 2026-10-13
      note: Only 'subject to available liquidity' is public. Any further gates would be in the offering memorandum (portal only). The RedemptionIdle owner EOA 0x8cf4…0765 can pause it.
  dealing:
    value: continuous
    source: { url: "https://superstate.com/assets/ustb", note: "Immediate for USDC, same-day for USD.", checkedAt: 2026-10-25 }
  noticeDays:
    status: public
    value: 0
    source: { url: "https://superstate.com/assets/ustb", checkedAt: 2026-10-25 }
  lockupDays:
    status: public
    value: 0
    source: { url: "https://superstate.com/assets/ustb", note: "'liquidity each market day'; no lock-up stated.", checkedAt: 2026-10-25 }
  dailyCapUsd:
    status: not_public
    searchedAt: 2026-10-25
    note: USDC redemptions are 'subject to available liquidity'.
  minimumUsd:
    status: not_public
    searchedAt: 2026-10-25
  feeBps:
    status: public
    value: 0
    source: { url: "https://etherscan.io/address/0x4c21b7577c8fe8b0b0669165ee7c8f67fa1454cf", note: "RedemptionIdle fee = 0", checkedAt: 2026-10-13 }
  liquidators:
