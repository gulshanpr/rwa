    - role: Investment manager
      name: Invesco Advisers, Inc.
      source: { url: "https://superstate.com/assets/ustb", checkedAt: 2026-10-25 }
    - role: Transfer agent
      name: Superstate Services LLC
      source: { url: "https://superstate.com/assets/ustb", checkedAt: 2026-10-25 }

