    source: { url: "https://docs.superstate.com/investors/tokenized-funds/available-funds/invesco-ustb", note: "Every transfer checks the allowlist. Aave Horizon holds USTB with permissioned liquidators.", checkedAt: 2026-10-25 }
  instant:
    - label: Superstate RedemptionIdle (USDC)
      chain: ethereum
      address: "0x4c21b7577c8fe8b0b0669165ee7c8f67fa1454cf"
      dailyCapUsd:
        status: not_public
        searchedAt: 2026-10-13
      fundedUsd:
        status: public
        value: 0.01
        source: { url: "https://etherscan.io/address/0x4c21b7577c8fe8b0b0669165ee7c8f67fa1454cf", note: "USDC.balanceOf = 0.013862 at block 26,183,016.", checkedAt: 2026-10-13 }
      feeBps: 0

