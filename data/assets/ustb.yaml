  auditedFinancials:
    status: not_public
    searchedAt: 2026-10-13
  insolvency:
    status: not_public
    searchedAt: 2026-10-13
    note: A separate series of a statutory trust. Only a secondary source (Yearn curation report) claims 'bankruptcy remoteness from Superstate Inc.'; no primary-document quote found.

