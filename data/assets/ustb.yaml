pricing:
  reference:
    type: oracle
    provider: superstate
    chain: ethereum
    address: "0xE4fA682f94610cCd170680cc3B045d77D9E528a8"
    writer: eoa
    dataOrigin: fund-administrator
    cadenceSeconds: 86400
    businessDaysOnly: true
    read:
      decimals: 6
      value: { fn: "function latestRoundData() view returns (uint80, int256, uint256, uint256, uint80)", index: 1 }
      updatedAt: { fn: "function checkpoints(uint256) view returns (uint64, uint64, uint128)", args: ["$value.0"], index: 1 }
    historyOnchain: true
    source: { url: "https://docs.superstate.com/investors/smart-contracts", note: "SuperstateOracle; owner EOA 0x4b1d…1395 posts one checkpoint per business day (NAV/S from NAV Fund Services). latestRoundData() extrapolates between checkpoints and returns the current block time as updatedAt, so freshness is read from checkpoints(roundId).effectiveAt. Each checkpoint may move at most maximumAcceptablePriceDelta ($1.00, about 9%); the oracle reverts if the newest checkpoint is over 5 days old.", checkedAt: 2026-10-13 }

verification:
  methods:
    - type: proof-of-asset
      provider: chronicle
      independent: true
      assetLevel: true
      frequency: daily
      cryptographicallyVerifiable: true
      onchain: true
      feed: { chain: ethereum, address: "0xDf8deCbDB89C95297ee6ef816Bd8A7B66973f254" }
      source: { url: "https://docs.chroniclelabs.org/Products/proofOfAsset/integratingPOAs/routers", note: "ChronicleVAO_Superstate_USTB_Router_2. readWithAge() sampled over 10 days to 2026-10-13: the age advanced about every 23.7h including weekends (11.231 → 11.2399), so the feed is live and daily. Blockscout mislabels the router. Independence and method are Chronicle's own claims; Yearn's July 2026 report said nothing was attested onchain.", checkedAt: 2026-10-13 }
    - type: self-reported
      provider: superstate
      independent: false
      assetLevel: true
      frequency: unstated
      cryptographicallyVerifiable: false
      onchain: false
      source: { url: "https://superstate.com/assets/ustb", note: "Issuer-published line-item holdings snapshot", checkedAt: 2026-10-13 }

exit:
  redemption:
    available:
      value: true
      source: { url: "https://docs.superstate.com/investors/tokenized-funds/available-funds/invesco-ustb", note: "USD wire, or USDC through the portal or onchain redeem on RedemptionIdle", checkedAt: 2026-10-13 }
    whoCanRedeem:
      value: whitelisted-holders
      source: { url: "https://docs.superstate.com/investors/tokenized-funds/available-funds/invesco-ustb", checkedAt: 2026-10-13 }
    settlement:
      status: public
      value: T+0
      source: { url: "https://docs.superstate.com/investors/tokenized-funds/available-funds/invesco-ustb", note: "USDC 'immediately (including non-business days, subject to available liquidity)'; USD same day if requested before 1pm ET", checkedAt: 2026-10-13 }
    gatesOrSuspension:
      status: not_public
      searchedAt: 2026-10-13
      note: "Only 'subject to available liquidity' is public. Any further gates would be in the offering memorandum (portal only). The RedemptionIdle owner EOA 0x8cf4…0765 can pause it."
  instantLiquidity:
    - type: offramp-contract
      label: Superstate RedemptionIdle (USDC)
      chain: ethereum
      address: "0x4c21B7577C8FE8b0B0669165ee7C8f67fa1454Cf"
      depthPctOfSupply: 1.1
      source: { url: "https://docs.superstate.com/investors/smart-contracts", note: "USDC balance $5.97M at block 26,261,719, about 1.1% of the ~$522M AUM (46.4M USTB at NAV $11.256). It was $0.013862 at block 26,183,016, so the balance swings with Superstate's top-ups. Owner and ProxyAdmin owner: EOA 0x8cf4…0765.", checkedAt: 2026-10-24 }

