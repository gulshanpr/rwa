    value: true
    source: { url: "https://etherscan.io/address/0xEC3582fcDC34078a4B7a8c75a5a3AE46f48525aB", note: "pricePoolPerShare returns computedAt. The vaults themselves never reject a stale price (maxSharePriceAge is unlimited).", checkedAt: 2026-10-25 }
