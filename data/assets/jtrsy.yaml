        fn: function markersPricePoolPerShare(uint64, bytes16) view returns (uint64, uint64, uint64)
        args: [ "281474976710662", "0x00010000000000060000000000000001" ]
        index: 0
    historyOnchain: true
    source: { url: "https://docs.centrifuge.io/developer/protocol/deployments/", note: "Spoke pricePoolPerShare for pool 281474976710662 (0x0001000000000006), share class 0x0001…0001. Written by the pool's only hub manager, EOA 0x7bf0…02ec, through Hub updateSharePrice and pushed to Spoke as UpdateSharePrice. One update per business day. Spoke maxSharePriceAge is 2^64−1, so vaults never reject a stale price. The Chronicle feed with the same value is not read by the vaults.", checkedAt: 2026-10-13 }
