      onchain: true
      feed: { chain: ethereum, address: "0xE980a33EFA3EDDaa689eCbdCE4B2278D4DB94471" }
      source: { url: "https://docs.chroniclelabs.org/Products/proofOfAsset/integratingPOAs/routers", note: "ChronicleVAO_Centrifuge_JTRSY_Router_1. readWithAge() = 1.119104 at review, age under an hour, updating on business days. Chainlink adapter 0x22d9…09aE also works. Blockscout labels these 'ChronicleVAO_James_BADBNY_20260312_Router_2' and 'Groma_GRO', which conflicts with Chronicle's docs; the value matches JTRSY's NAV. Independence and method rest on Chronicle's own claims.", checkedAt: 2026-10-13 }

